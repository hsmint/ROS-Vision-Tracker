# 노드 파라미터 — 인터페이스 표의 단위·부호·주기·타임아웃과 같은 값이다.
tracking_controller:
  ros__parameters:
    kp: 1.0               # [rad/s] / 정규화 오차 1.0 — ex=0.4 → 0.4 rad/s
    cmd_sign: -1.0        # REP-103 angular.z + = 왼쪽. ex>0(오른쪽) → 음수 명령
    deadband: 0.05        # |ex| < 0.05 는 정지(중심 근처 떨림 방지)
    max_speed: 0.6        # [rad/s] 포화
    rate_hz: 20.0         # 명령·상태 주기
    timeout: 0.5          # [s] 마지막 신선한 입력 수신 후 (과제 기본값, 30 fps에서 약 15프레임 유실)
    max_input_age: 0.5    # [s] header.stamp가 이보다 오래되면 신선하지 않음
    # 틸트(상하) — 2축 확장. false면 팬 1축(평가 필수 지표는 팬 기준)
    tilt_enabled: true
    kp_tilt: 0.8          # [rad/s] / 정규화 오차 1.0 (세로 화각이 좁아 ey=1 ≈ 21°, 팬은 ex=1 ≈ 35°)
    cmd_sign_tilt: 1.0    # REP-103 angular.y + = 아래. ey>0(아래) → 양수 명령. 실제 모터로 확인
    deadband_tilt: 0.05
    max_speed_tilt: 0.4   # [rad/s] 중력이 걸리는 축이라 팬보다 낮게

motor_driver:
  ros__parameters:
    output_enabled: false # 모터 출력 OFF — 명령은 로그로만 남긴다
    cmd_timeout: 0.2      # [s] 명령이 끊기면 구동부에서도 정지(이중 안전)
    hw_max_speed: 0.6     # [rad/s] 팬
    hw_max_speed_tilt: 0.4  # [rad/s] 틸트

# target_detector 설정은 target_perception/config/detector.yaml (HSV·면적·해상도·뎁스 검증)
