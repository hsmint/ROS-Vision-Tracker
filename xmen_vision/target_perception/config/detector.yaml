# target_perception 검출 설정 — 코드 수정 없이 이 파일만 바꿔서 튜닝한다.
# 목표: 파란 30×30×60 mm 직육면체, 어두움~밝음, 0.1~1 m. 세 장면(보임·없음·가림)은 같은 설정으로 확인한다.

target:
  name: blue_cube            # 사진·결과 JSON에 기록되는 목표 이름
  # OpenCV HSV 범위: H 0~179, S 0~255, V 0~255
  # 빨강처럼 H가 0/179 경계를 넘는 색은 범위를 두 개 적는다(합집합).
  # 실측(<ws>/results/perception/dataset, 조명 3 × 거리 0.15~1.0 m, 1,400장) 기준 최적화:
  #   큐브 H 110~113, S 248~255, V 38~46(어두움)·84~103(보통·밝음)
  #   배경(보라 의자·청회색 카펫)의 H 100~125 픽셀: S 중앙값 69~83, 상위 1% 124~163
  #   S 하한 170~230에서만 인식 100%·오검출 0% → 가운데 200. H는 큐브 112 중심 ±8.
  hsv_ranges:
    - lower: [104, 200, 8]
      upper: [120, 255, 255]
  # 완화 범위(relaxed_ranges)는 쓰지 않는다: 배경 S가 80~125라 큐브에 붙은 의자·카펫까지 큐브로 번져
  # 크기 불일치로 탈락했다(어두움 0%, 밝음 57%). 제거 후 실측 인식 100%.
  # 색 세기(max−min) 하한: 어두운 픽셀의 S는 잡음만으로 커지므로 잡음 수준 이하는 버린다.
  min_chroma: 5
  # 크기 기반 면적 제한(selection의 auto): size_mm 크기의 물체가 distance_range_m 범위에 있다고 본다.
  # 최소 면적 = 1 m에서 끝면(30×30)이 보일 때, 최대 면적 = 0.1 m에서 옆면(30×60)이 보일 때 기준.
  size_mm: [30, 30, 60]      # 가로·세로·높이 [mm]. 정육면체면 숫자 하나
  distance_range_m: [0.1, 1.0]

camera:
  backend: realsense         # realsense(pyrealsense2) | v4l2(OpenCV VideoCapture, 예비용)
  device: 6                  # v4l2 장치 번호(backend: v4l2일 때만). 이 PC에서는 /dev/video6 = D435 컬러
  fps: 30
  warmup_frames: 30          # 자동 노출·화이트밸런스 안정화용으로 버리는 프레임 수
  # HSV 값은 노출·화이트밸런스가 바뀌면 같이 변한다. 튜닝 후에는 고정을 권장한다.
  # null = 자동. tune 모드에서 현재 자동값이 출력되니 그 값을 적으면 된다.
  # 조명이 바뀌는 환경: 노출은 자동(밝기 변화를 카메라가 흡수), 화이트밸런스는 고정(색상 H가 흔들리지 않게).
  # 노출을 고정하면 어두운 곳에서 V가 그대로 떨어진다. 4600 K = 이 방에서 측정한 자동 화이트밸런스 값.
  exposure: null             # RealSense 컬러 노출(1~10000, 단위 0.1ms 상당). null = 자동
  white_balance: 4600        # RealSense 화이트밸런스(2800~6500 K). null = 자동
  options:                   # 그 밖의 RealSense 컬러 옵션(이름: 값) — 실제 카메라에서 확인 필요
    auto_exposure_priority: 1  # 1 = 어두우면 프레임률을 낮춰서라도 노출을 늘림(잡음↓, 30→15 fps 가능)
    backlight_compensation: 0  # 역광 보정 끔(밝은 배경 앞 큐브가 더 어두워지는 것 방지 효과는 실측으로 확인)
  fx_px: 460.0               # 컬러 초점거리 [px] @ fx_width. 640×360(16:9)은 약 460, 640×480(4:3)은 약 615.
  fx_width: 640              # RealSense 실행 시 실제 내부 파라미터로 덮어쓰고 면적 기준을 다시 계산한다

processing:
  # 처리 해상도. 입력이 다르면 이 크기로 리사이즈한 뒤 처리한다.
  # 면적 기준(min_area)은 이 해상도 기준 픽셀 수다.
  # D435는 630×360 같은 임의 크기를 지원하지 않는다. 640×360은 컬러·뎁스 모두 지원.
  # 비율이 다른 입력(640×480 사진·모의 영상)은 늘리지 않고 가운데를 16:9로 잘라서 쓴다(위아래 60줄씩).
  width: 640
  height: 360
  blur_ksize: 5              # 가우시안 블러 커널(홀수, 0이면 생략)
  morph_kernel: 5            # 모폴로지 커널 크기
  open_iterations: 1         # 열림: 작은 점 잡음 제거
  close_iterations: 2        # 닫힘: 물체 내부 구멍·틈 메우기

selection:
  # 뎁스가 없을 때(사진·웹캠·뎁스 끔)의 최소 면적. 뎁스가 있으면 depth.min_area_px와 실제 크기 검사를 쓴다.
  min_area: auto             # auto = min_area_factor × (가장 먼 거리에서 가장 작은 면 30×30의 넓이)
  min_area_factor: 0.3       # 회전·가림·원근 여유. 640×360·fx 460·1 m → 0.3 × 190 ≈ 57 px
  max_area_ratio: auto       # auto = 가장 가까운 거리에서 가장 큰 면 30×60 기준(최소 0.6, 최대 0.95)
  max_aspect: 3.0            # 외접 사각형 긴 변/짧은 변. 30×60 옆면은 2:1 — 이보다 훨씬 긴 줄무늬·막대 제거
  min_extent: 0.35           # 면적/minAreaRect 면적. 구불구불한 덩어리 제거(0.45는 어두운 잡음 속 큐브 탈락)
  min_solidity: 0.5          # 면적/볼록껍질 면적. 가림을 허용하려고 낮게 둔다
  # 후보 여러 개 중 선택 규칙:
  #   1) 위 필터를 통과한 후보 중 면적이 가장 큰 것
  #   2) 면적 차이가 tie_ratio 이내이면 영상 중심에 더 가까운 것
  tie_ratio: 0.1
  center_method: hull        # 볼록껍질 중심 — 하이라이트·그늘에 덜 끌려간다(문제 2의 ex가 덜 흔들림)

depth:
  # 컨투어 안 뎁스 중앙값 Z로 후보를 검증한다(RealSense만). 과제 기준: 가까운 거리 ~ 1 m.
  enabled: true
  min_m: 0.1                 # D435 최소 측정거리(약 0.2 m)보다 가까우면 뎁스가 0 → min_area 규칙으로 판단
  max_m: 1.1                 # 목표 0.1~1.0 m. 1.0 m 위치 실측 Z 1.01~1.03 + 여유. 더 먼 같은 색 물체는 depth_range
  min_valid_ratio: 0.3       # 컨투어 안 유효(0 아님) 뎁스 픽셀 비율 하한
  erode: 1                   # 경계 픽셀 제외용 침식 횟수(3×3)
  min_area_px: 80            # 뎁스가 있을 때 픽셀 최소 면적(잡음 바닥). 실측 1 m 최소 211 px, 반쯤 가려도 통과
  no_depth_min_area: 800     # 뎁스 측정 실패(최소 측정거리보다 가까움·반사면)일 때 색만으로 믿을 최소 면적.
                             # 0.2 m 안쪽의 큐브는 끝면만 보여도 4,700 px² 이상이라 800이면 충분하다
  # 목표 3×3×6 cm 직육면체. 실측(0.15~1.03 m): 짧은 변 2.0~3.1 cm, 긴 변 5.4~6.2 cm, 면적 10.7~17.8 cm²
  # 상한은 비스듬히 두 면이 보일 때(짧은 변 ≤ 4.2, 긴 변 ≤ 6.7 cm)에 여유, 하한은 가림 허용
  max_short_m: 0.05
  max_long_m: 0.08
  area_m2: [0.0003, 0.0030]  # 3~30 cm²
  # 같은 색 물체와 겹쳐 size_mismatch가 된 덩어리를 뎁스가 끊기는 경계에서 나눠 다시 검증한다(앞뒤로 겹친 경우)
  split: true
  split_jump_m: 0.02         # 이웃 픽셀 뎁스 차가 이보다 크면 다른 물체로 본다(m)
  split_jump_ratio: 0.03     # 먼 거리 뎁스 잡음 대비: 기준 = max(split_jump_m, 거리×이 값)
  split_min_valid: 0.6       # 덩어리 안 유효 뎁스 비율이 이보다 낮으면(너무 가까움 등) 나누지 않는다
